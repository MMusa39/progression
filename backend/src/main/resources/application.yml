# Settings shared by every environment. Profile-specific files
# (application-local.yml, application-prod.yml) override these.
spring:
  application:
    name: progression-api
  threads:
    virtual:
      # Serve each request on a Java 21+ virtual thread: cheap blocking I/O without reactive code.
      enabled: true
  jpa:
    # Don't keep DB sessions open during view rendering; all data access happens in services.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Load lazy collections in batches (avoids N+1 queries when listing workouts).
        default_batch_fetch_size: 50
  mvc:
    problemdetails:
      # Return RFC 9457 application/problem+json for framework-level errors too.
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      # Small and steady: a t4g.micro database allows ~80 connections in total.
      maximum-pool-size: 10
      minimum-idle: 2
  docker:
    compose:
      # Leave the database running when the app stops, so restarts are fast.
      lifecycle-management: start-only

server:
  error:
    include-stacktrace: never
  # Finish in-flight requests before stopping (rolling deploys), then give up after 20s.
  shutdown: graceful
  # Behind the load balancer: trust X-Forwarded-* for the client IP and scheme.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # The load balancer only needs UP/DOWN; component details stay private.
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
